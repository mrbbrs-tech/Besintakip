<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0e0e14"/>
<title>Besin Takip</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0e0e14;--s1:#14141e;--s2:#1a1a28;--brd:#22223a;
  --acc:#c8ff00;--text:#f0ede6;--mut:#5a5a7a;
  --pro:#ff6b6b;--karb:#5ba3ff;--yag:#ffb85d;--lif:#4dd0c4;
  --mono:'DM Mono',monospace;
}
html,body{background:var(--bg)}
#app{min-height:100vh;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);padding-bottom:50px}

.strip{background:var(--s1);border-bottom:1px solid var(--brd);padding:14px 14px;display:flex;align-items:center;gap:12px}
.ring-wrap{position:relative;width:72px;height:72px;flex-shrink:0}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-kcal{font-family:'Bebas Neue',sans-serif;font-size:19px;color:var(--acc);line-height:1}
.ring-lbl{font-family:var(--mono);font-size:7px;color:var(--mut);letter-spacing:1px}
.mbars{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.mrow{display:flex;align-items:center;gap:7px}
.mlbl{font-family:var(--mono);font-size:9px;color:var(--mut);width:24px;text-transform:uppercase;flex-shrink:0}
.mtrack{flex:1;height:4px;background:var(--s2);border-radius:2px;overflow:hidden}
.mfill{height:100%;border-radius:2px;transition:width .3s}
.mval{font-family:var(--mono);font-size:9px;width:54px;text-align:right;flex-shrink:0}
.strip-btns{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.strip-btn{background:var(--s2);border:1px solid var(--brd);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:10px;font-weight:600;padding:6px 8px;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap}
.strip-btn:active{border-color:var(--acc)}

.tabs{display:flex;background:var(--s1);border-bottom:1px solid var(--brd);position:sticky;top:0;z-index:50}
.tab{flex:1;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--mut);border-bottom:2px solid transparent;cursor:pointer;font-size:9px;font-weight:600;text-align:center;line-height:1.5}
.tab.on{color:var(--acc);border-color:var(--acc)}
.tab-kcal{font-family:var(--mono);font-size:8px}

.sec{padding:14px}
.meal-summary{background:var(--s2);border-radius:10px;padding:10px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.ms-kcal{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--acc)}
.ms-label{font-family:var(--mono);font-size:9px;color:var(--mut)}
.ms-macros{display:flex;gap:10px}
.ms-m{text-align:center}
.ms-v{font-family:var(--mono);font-size:11px;font-weight:500}
.ms-l{font-family:var(--mono);font-size:8px;color:var(--mut);text-transform:uppercase}

.added-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.added-row{display:flex;align-items:center;gap:10px;background:var(--s2);border-radius:10px;padding:9px 12px}
.added-emoji{font-size:16px;flex-shrink:0}
.added-info{flex:1;min-width:0}
.added-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.added-sub{font-family:var(--mono);font-size:9px;color:var(--mut);margin-top:2px}
.added-kal{font-family:'Bebas Neue',sans-serif;font-size:17px;color:var(--acc);flex-shrink:0}
.del-btn{background:none;border:none;color:var(--mut);font-size:18px;cursor:pointer;padding:4px 4px;line-height:1;flex-shrink:0}
.empty{font-family:var(--mono);font-size:11px;color:var(--mut);padding:6px 2px 12px;text-align:center}

.qa-label{font-family:var(--mono);font-size:10px;color:var(--mut);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;margin-top:4px}
.cat-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.cat-chip{padding:6px 13px;border-radius:20px;border:1px solid var(--brd);background:transparent;color:var(--mut);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.cat-chip.on{background:var(--acc);color:#0e0e14;border-color:var(--acc)}
.food-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.food-btn{background:var(--s1);border:1px solid var(--brd);border-radius:12px;padding:11px 11px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:9px;min-height:48px}
.food-btn:active{border-color:var(--acc)}
.fb-emoji{font-size:18px;flex-shrink:0}
.fb-info{flex:1;min-width:0}
.fb-name{font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb-kal{font-family:var(--mono);font-size:10px;color:var(--acc);margin-top:1px}
.fb-unit{font-family:var(--mono);font-size:9px;color:var(--mut)}
.fb-var{font-family:var(--mono);font-size:9px;color:#5ba3ff}

.act-total{background:var(--s2);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.at-v{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--pro)}
.at-l{font-family:var(--mono);font-size:9px;color:var(--mut)}
.act-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.act-card{background:var(--s1);border:1px solid var(--brd);border-radius:14px;padding:14px 16px}
.act-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.act-emoji{font-size:22px}
.act-name{font-size:14px;font-weight:700}
.act-note{font-family:var(--mono);font-size:9px;color:var(--mut);margin-top:2px}
.act-row{display:flex;align-items:center;gap:10px}
.act-btn{width:40px;height:40px;border-radius:10px;background:var(--s2);border:none;color:var(--text);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.act-input{flex:1;background:var(--bg);border:1px solid var(--brd);border-radius:8px;color:var(--acc);font-family:'Bebas Neue',sans-serif;font-size:26px;text-align:center;padding:8px;width:100%}
.act-unit{font-family:var(--mono);font-size:11px;color:var(--mut);min-width:28px;text-align:center}
.act-burn{font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--pro);margin-top:8px;text-align:right}

.add-custom-btn{width:100%;padding:12px;background:transparent;border:1px dashed var(--brd);border-radius:12px;color:var(--mut);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px}
.custom-form{background:var(--s1);border:1px solid #5ba3ff44;border-radius:14px;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.cf-title{font-family:var(--mono);font-size:10px;color:#5ba3ff;letter-spacing:1px;text-transform:uppercase}
.cf-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cf-input{background:var(--s2);border:1px solid var(--brd);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:10px 12px;outline:none;width:100%}
.cf-save{padding:12px;background:#5ba3ff;color:#0e0e14;border:none;border-radius:10px;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px;cursor:pointer}
.cf-cancel{padding:9px;background:transparent;border:none;color:var(--mut);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;text-align:center}

.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:200;display:flex;align-items:flex-end}
.sheet{background:var(--s1);border-radius:20px 20px 0 0;width:100%;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto}
.sh-handle{width:36px;height:4px;background:var(--brd);border-radius:2px;margin:0 auto 18px}
.sh-food{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sh-emoji{font-size:28px}
.sh-name{font-family:'Bebas Neue',sans-serif;font-size:21px;letter-spacing:1px;color:var(--text)}
.sh-note{font-family:var(--mono);font-size:10px;color:var(--mut);margin-top:2px}
.variant-row{display:flex;gap:8px;margin-bottom:14px}
.var-btn{flex:1;padding:10px;border-radius:10px;border:1px solid var(--brd);background:transparent;color:var(--mut);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;text-align:center}
.var-btn.on{background:var(--s2);border-color:#5ba3ff;color:#5ba3ff}
.amt-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.amt-btn{width:46px;height:46px;border-radius:12px;background:var(--s2);border:none;color:var(--text);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.amt-val{flex:1;background:var(--bg);border:1px solid var(--brd);border-radius:10px;color:var(--acc);font-family:'Bebas Neue',sans-serif;font-size:30px;text-align:center;padding:8px;width:100%}
.amt-unit{font-family:var(--mono);font-size:12px;color:var(--mut);width:46px;text-align:center}
.prev-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px}
.prev-box{background:var(--s2);border-radius:10px;padding:8px 4px;text-align:center}
.prev-v{font-family:'Bebas Neue',sans-serif;font-size:17px;color:var(--acc)}
.prev-l{font-family:var(--mono);font-size:8px;color:var(--mut);text-transform:uppercase}
.sh-add{width:100%;padding:15px;background:var(--acc);color:#0e0e14;border:none;border-radius:12px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;cursor:pointer}

.sumcard{background:var(--s1);border:1px solid var(--brd);border-radius:14px;padding:16px;margin-bottom:14px}
.sumcard-title{font-family:var(--mono);font-size:10px;color:var(--mut);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.sum-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px}
.sum-box{background:var(--s2);border-radius:10px;padding:9px 4px;text-align:center}
.sum-v{font-family:'Bebas Neue',sans-serif;font-size:16px}
.sum-l{font-family:var(--mono);font-size:8px;color:var(--mut);text-transform:uppercase}
.sum-meal{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--brd)}
.sum-meal:last-child{border-bottom:none}
.sum-meal-name{font-size:13px;font-weight:600}
.sum-meal-kcal{font-family:var(--mono);font-size:12px;color:var(--acc)}
.big-share-btn{width:100%;padding:16px;background:var(--acc);color:#0e0e14;border:none;border-radius:14px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--acc);color:#0e0e14;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;padding:11px 22px;border-radius:20px;z-index:300;white-space:nowrap}
.errbox{background:#1a0000;color:#ff6b6b;font-family:monospace;font-size:13px;padding:20px;min-height:100vh;white-space:pre-wrap;word-break:break-word}
</style>
</head>

  { name:"Zeytinyağı", emoji:"🫒", unit:"yemek kaşığı", step:1, base:1, kal:90, pro:0, karb:0, yag:10, lif:0, cat:"meyvesebze", note:"1 yemek kaşığı ≈ 10ml" },
  { name:"Filtre Kahve / Sade Soda", emoji:"☕", unit:"fincan/şişe", step:1, base:1, kal:2, pro:0.1, karb:0, yag:0, lif:0, cat:"meyvesebze", note:"Sade, kalorisiz" },
  { name:"Pre-Workout", emoji:"⚡", unit:"servis", step:1, base:1, kal:15, pro:0, karb:1.5, yag:0, lif:0, cat:"meyvesebze", note:"1 servis/ölçek ≈ 10g" },
  { name:"Sade Kahve (Filtre / Türk Kahvesi)", emoji:"☕", unit:"bardak", step:1, base:1, kal:2, pro:0.2, karb:0, yag:0, lif:0, cat:"meyvesebze", note:"1 bardak/kupa ≈ 250ml" }
];

var ACTIVITIES = [
  { name:"Full Body Antrenman", emoji:"🏋️", unit:"dk", perUnit:7, note:"Dk başına ~7 kcal" },
  { name:"Yürüyüş Bandı Incline", emoji:"🏃", unit:"dk", perUnit:8, note:"Dk başına ~8 kcal" },
  { name:"Kondisyon Bisikleti", emoji:"🚴", unit:"dk", perUnit:7.5, note:"Dk başına ~7.5 kcal" }
];

var MEAL_NAMES = ["Sabah", "Öğle", "Akşam"];
var MEAL_ICONS = ["☀️", "🌤️", "🌙"];
var CATS = [
  { key:"hepsi", label:"Hepsi" },
  { key:"protein", label:"Protein" },
  { key:"karb", label:"Karbonhidrat" },
  { key:"sut", label:"Süt Ürünleri" },
  { key:"meyvesebze", label:"Meyve/Sebze" },
  { key:"özel", label:"Özel" }
];
var CUSTOM_UNITS = ["g","adet","porsiyon","dilim","servis","bardak","kaşık","yemek kaşığı","tatlı kaşığı","KK","kase"];

/* ============================= DEPOLAMA ============================= */

function todayKey() {
  var d = new Date();
  return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
}
function loadJSON(key, fallback) {
  try { var s = localStorage.getItem(key); return s ? JSON.parse(s) : fallback; }
  catch(e) { return fallback; }
}
function saveJSON(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
}

function getTarget() { return loadJSON("bt_target", TARGET_DEFAULT); }
function setTargetData(t) { saveJSON("bt_target", t); }

function getCustomFoods() { return loadJSON("bt_custom", []); }
function setCustomFoods(arr) { saveJSON("bt_custom", arr); }

function getEntries() {
  var raw = loadJSON("bt_entries", { day: todayKey(), data: {0:[],1:[],2:[]} });
  if (raw.day !== todayKey()) return {0:[],1:[],2:[]};
  return raw.data;
}
function setEntries(data) { saveJSON("bt_entries", { day: todayKey(), data: data }); }

function getActs() {
  var raw = loadJSON("bt_acts", { day: todayKey(), data: {0:0,1:0,2:0} });
  if (raw.day !== todayKey()) return {0:0,1:0,2:0};
  return raw.data;
}
function setActs(data) { saveJSON("bt_acts", { day: todayKey(), data: data }); }

/* ============================= UI STATE ============================= */

var ui = {
  tab: 0,
  cat: "hepsi",
  sheet: null,
  targetSheetOpen: false,
  customFormOpen: false,
  toast: null
};

/* ============================= HESAPLAMA ============================= */

function allFoods() { return FOODS.concat(getCustomFoods()); }

function resolveFood(food, variant) {
  if (!food.variants) return food;
  var v = food.variants[variant] || food.variants.pismis;
  var out = {};
  for (var k in food) out[k] = food[k];
  for (var k2 in v) out[k2] = v[k2];
  return out;
}

function calcFood(food, amt) {
  var ratio = food.unit === "g" ? amt / food.base : amt;
  return {
    kal: Math.round(food.kal * ratio),
    pro: Math.round(food.pro * ratio * 10) / 10,
    karb: Math.round(food.karb * ratio * 10) / 10,
    yag: Math.round(food.yag * ratio * 10) / 10,
    lif: Math.round((food.lif||0) * ratio * 10) / 10
  };
}

function mealTotals(items) {
  var t = { kal:0, pro:0, karb:0, yag:0, lif:0 };
  for (var i = 0; i < items.length; i++) {
    var n = calcFood(items[i].food, items[i].amt);
    t.kal += n.kal; t.pro += n.pro; t.karb += n.karb; t.yag += n.yag; t.lif += n.lif;
  }
  t.pro = Math.round(t.pro*10)/10; t.karb = Math.round(t.karb*10)/10; t.yag = Math.round(t.yag*10)/10; t.lif = Math.round(t.lif*10)/10;
  return t;
}

function allFoodTotals() {
  var entries = getEntries();
  var t = { kal:0, pro:0, karb:0, yag:0, lif:0 };
  [0,1,2].forEach(function(i) {
    var mt = mealTotals(entries[i] || []);
    t.kal += mt.kal; t.pro += mt.pro; t.karb += mt.karb; t.yag += mt.yag; t.lif += mt.lif;
  });
  t.pro = Math.round(t.pro*10)/10; t.karb = Math.round(t.karb*10)/10; t.yag = Math.round(t.yag*10)/10; t.lif = Math.round(t.lif*10)/10;
  return t;
}

function totalBurn() {
  var acts = getActs();
  var sum = 0;
  for (var i = 0; i < ACTIVITIES.length; i++) sum += Math.round(ACTIVITIES[i].perUnit * (acts[i] || 0));
  return sum;
}

function catLabel(key) {
  for (var i = 0; i < CATS.length; i++) if (CATS[i].key === key) return CATS[i].label;
  return key;
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function fmtAmt(n) {
  return (Math.round(n*100)/100).toString();
}

/* ============================= RENDER ============================= */

function render() {
  try {
    var html = "";
    html += renderStrip();
    html += renderTabs();
    if (ui.tab === 3) html += renderActivityTab();
    else if (ui.tab === 4) html += renderSummaryTab();
    else html += renderMealTab();
    html += renderSheet();
    html += renderTargetSheet();
    if (ui.toast) html += '<div class="toast">' + esc(ui.toast) + '</div>';
    document.getElementById("app").innerHTML = html;
  } catch(e) {
    document.getElementById("app").innerHTML = '<div class="errbox">⚠️ Render hatası:\n' + esc(e.message) + '\n\n' + esc(e.stack || "") + '</div>';
  }
}

function renderStrip() {
  var target = getTarget();
  var ft = allFoodTotals();
  var burn = totalBurn();
  var net = ft.kal - burn;
  var pct = Math.min(100, Math.max(0, (net / target.kal) * 100));
  var R = 28, CIRC = 2 * Math.PI * R;
  var dashoffset = CIRC * (1 - pct/100);

  var rows = [
    { l:"PRO", v:ft.pro, t:target.pro, c:"var(--pro)" },
    { l:"KRB", v:ft.karb, t:target.karb, c:"var(--karb)" },
    { l:"YAĞ", v:ft.yag, t:target.yag, c:"var(--yag)" },
    { l:"LİF", v:ft.lif, t:target.lif, c:"var(--lif)" }
  ];
  var barsHtml = "";
  rows.forEach(function(r) {
    var w = Math.min(100, (r.v / r.t) * 100);
    barsHtml += '<div class="mrow"><div class="mlbl">' + r.l + '</div>' +
      '<div class="mtrack"><div class="mfill" style="width:' + w + '%;background:' + r.c + '"></div></div>' +
      '<div class="mval" style="color:' + r.c + '">' + r.v + 'g<span style="color:var(--mut)">/' + r.t + '</span></div></div>';
  });

  return '<div class="strip">' +
    '<div class="ring-wrap"><svg width="72" height="72" style="transform:rotate(-90deg)">' +
    '<circle cx="36" cy="36" r="' + R + '" fill="none" stroke="#1a1a28" stroke-width="6"></circle>' +
    '<circle cx="36" cy="36" r="' + R + '" fill="none" stroke="#c8ff00" stroke-width="6" stroke-dasharray="' + CIRC + '" stroke-dashoffset="' + dashoffset + '" stroke-linecap="round"></circle>' +
    '</svg><div class="ring-center"><div class="ring-kcal">' + net + '</div><div class="ring-lbl">net kcal</div></div></div>' +
    '<div class="mbars">' + barsHtml + '</div>' +
    '<div class="strip-btns">' +
    '<button class="strip-btn" onclick="shareDay()">📤 Paylaş</button>' +
    '<button class="strip-btn" onclick="openTargetSheet()">🎯 Hedef</button>' +
    '</div></div>';
}

function renderTabs() {
  var entries = getEntries();
  var burn = totalBurn();
  var html = '<div class="tabs">';
  for (var i = 0; i < 3; i++) {
    var mt = mealTotals(entries[i] || []);
    html += '<div class="tab' + (ui.tab===i?' on':'') + '" onclick="setTab(' + i + ')">' +
      '<span>' + MEAL_ICONS[i] + '</span><span style="font-size:9px;font-weight:600">' + MEAL_NAMES[i] + '</span>' +
      '<span class="tab-kcal" style="color:' + (mt.kal>0?'var(--acc)':'var(--mut)') + '">' + (mt.kal>0?mt.kal:'—') + '</span></div>';
  }
  html += '<div class="tab' + (ui.tab===3?' on':'') + '" onclick="setTab(3)">' +
    '<span>🏃</span><span style="font-size:9px">Aktivite</span>' +
    '<span class="tab-kcal" style="color:' + (burn>0?'var(--pro)':'var(--mut)') + '">' + (burn>0?('-'+burn):'—') + '</span></div>';
  html += '<div class="tab' + (ui.tab===4?' on':'') + '" onclick="setTab(4)">' +
    '<span>📊</span><span style="font-size:9px">Özet</span><span class="tab-kcal">&nbsp;</span></div>';
  html += '</div>';
  return html;
}

function renderMealTab() {
  var entries = getEntries();
  var items = entries[ui.tab] || [];
  var mt = mealTotals(items);
  var html = '<div class="sec">';

  if (items.length > 0) {
    html += '<div class="meal-summary"><div><div class="ms-kcal">' + mt.kal + ' kcal</div><div class="ms-label">' + MEAL_NAMES[ui.tab] + ' toplam</div></div>' +
      '<div class="ms-macros">' +
      '<div class="ms-m"><div class="ms-v" style="color:var(--pro)">' + mt.pro + 'g</div><div class="ms-l">pro</div></div>' +
      '<div class="ms-m"><div class="ms-v" style="color:var(--karb)">' + mt.karb + 'g</div><div class="ms-l">krb</div></div>' +
      '<div class="ms-m"><div class="ms-v" style="color:var(--yag)">' + mt.yag + 'g</div><div class="ms-l">yağ</div></div>' +
      '<div class="ms-m"><div class="ms-v" style="color:var(--lif)">' + mt.lif + 'g</div><div class="ms-l">lif</div></div>' +
      '</div></div>';

    html += '<div class="added-list">';
    items.forEach(function(it, idx) {
      var n = calcFood(it.food, it.amt);
      var vl = it.variant ? (it.variant === "cig" ? " (çiğ)" : " (pişmiş)") : "";
      html += '<div class="added-row"><div class="added-emoji">' + it.food.emoji + '</div>' +
        '<div class="added-info"><div class="added-name">' + esc(it.food.name) + vl + '</div>' +
        '<div class="added-sub">P:' + n.pro + 'g · K:' + n.karb + 'g · Lif:' + n.lif + 'g · ' + fmtAmt(it.amt) + ' ' + esc(it.food.unit) + '</div></div>' +
        '<div class="added-kal">' + n.kal + '</div>' +
        '<button class="del-btn" onclick="removeEntry(' + idx + ')">×</button></div>';
    });
    html += '</div>';
  } else {
    html += '<div class="empty">Henüz eklenmedi</div>';
  }

  html += '<div class="qa-label">Ekle</div>';

  if (ui.customFormOpen) html += renderCustomForm();
  else html += '<button class="add-custom-btn" onclick="openCustomForm()">+ Özel ürün ekle</button>';

  html += '<div class="cat-row">';
  CATS.forEach(function(c) {
    html += '<div class="cat-chip' + (ui.cat===c.key?' on':'') + '" onclick="setCat(\'' + c.key + '\')">' + esc(c.label) + '</div>';
  });
  html += '</div>';

  var foods = allFoods();
  html += '<div class="food-grid">';
  foods.forEach(function(f, idx) {
    if (ui.cat !== "hepsi" && f.cat !== ui.cat) return;
    var d = resolveFood(f, "pismis");
    html += '<div class="food-btn" onclick="openSheet(' + idx + ')">' +
      '<div class="fb-emoji">' + f.emoji + '</div>' +
      '<div class="fb-info"><div class="fb-name">' + esc(f.name) + '</div>' +
      '<div class="fb-kal">' + d.kal + ' kcal</div>' +
      '<div class="fb-unit">/ 1 ' + esc(d.unit) + '</div>' +
      (f.variants ? '<div class="fb-var">çiğ / pişmiş</div>' : '') +
      '</div></div>';
  });
  html += '</div></div>';
  return html;
}

function renderCustomForm() {
  var opts = "";
  CUSTOM_UNITS.forEach(function(u) { opts += '<option value="' + u + '">' + u + (u==="g"?" (100g baz)":"") + '</option>'; });
  return '<div class="custom-form">' +
    '<div class="cf-title">+ Özel Ürün Ekle</div>' +
    '<div class="cf-row">' +
    '<input class="cf-input" id="cf-name" placeholder="İsim *">' +
    '<input class="cf-input" id="cf-emoji" placeholder="Emoji" value="🍽️" style="text-align:center;font-size:18px">' +
    '</div>' +
    '<div class="cf-row">' +
    '<input class="cf-input" id="cf-kal" type="number" placeholder="Kalori *">' +
    '<select class="cf-input" id="cf-unit">' + opts + '</select></div>' +
    '<div class="cf-row">' +
    '<input class="cf-input" id="cf-pro" type="number" step="0.1" placeholder="Protein (g)">' +
    '<input class="cf-input" id="cf-karb" type="number" step="0.1" placeholder="Karb (g)">' +
    '</div>' +
    '<div class="cf-row">' +
    '<input class="cf-input" id="cf-yag" type="number" step="0.1" placeholder="Yağ (g)">' +
    '<input class="cf-input" id="cf-lif" type="number" step="0.1" placeholder="Lif (g)">' +
    '</div>' +
    '<button class="cf-save" onclick="saveCustomFood()">KAYDET</button>' +
    '<button class="cf-cancel" onclick="closeCustomForm()">İptal</button>' +
    '</div>';
}

function renderActivityTab() {
  var acts = getActs();
  var burn = totalBurn();
  var ft = allFoodTotals();
  var net = ft.kal - burn;
  var html = '<div class="sec">';

  if (burn > 0) {
    html += '<div class="act-total"><div><div class="at-v">-' + burn + ' kcal</div><div class="at-l">toplam yakılan</div></div>' +
      '<div style="text-align:right"><div style="font-family:var(--mono);font-size:11px;color:var(--acc)">' + ft.kal + ' - ' + burn + '</div>' +
      '<div style="font-family:\'Bebas Neue\';font-size:20px;color:var(--acc)">' + net + ' net kcal</div></div></div>';
  }

  html += '<div class="act-grid">';
  ACTIVITIES.forEach(function(a, i) {
    var amt = acts[i] || 0;
    html += '<div class="act-card"><div class="act-top"><div class="act-emoji">' + a.emoji + '</div>' +
      '<div><div class="act-name">' + esc(a.name) + '</div><div class="act-note">' + esc(a.note) + '</div></div></div>' +
      '<div class="act-row">' +
      '<button class="act-btn" onclick="changeAct(' + i + ',-5)">−</button>' +
      '<input class="amt-val act-input" type="number" min="0" value="' + amt + '" onchange="setAct(' + i + ',this.value)">' +
      '<button class="act-btn" onclick="changeAct(' + i + ',5)">+</button>' +
      '<div class="act-unit">' + a.unit + '</div></div>' +
      (amt > 0 ? '<div class="act-burn">-' + Math.round(a.perUnit*amt) + ' kcal yakıldı</div>' : '') +
      '</div>';
  });
  html += '</div></div>';
  return html;
}

function renderSummaryTab() {
  var entries = getEntries();
  var target = getTarget();
  var ft = allFoodTotals();
  var burn = totalBurn();
  var net = ft.kal - burn;
  var html = '<div class="sec">';

  html += '<div class="sumcard"><div class="sumcard-title">Günün Durumu</div>' +
    '<div class="sum-grid">' +
    '<div class="sum-box"><div class="sum-v" style="color:var(--acc)">' + net + '</div><div class="sum-l">net kcal</div></div>' +
    '<div class="sum-box"><div class="sum-v" style="color:var(--pro)">' + ft.pro + 'g</div><div class="sum-l">protein</div></div>' +
    '<div class="sum-box"><div class="sum-v" style="color:var(--karb)">' + ft.karb + 'g</div><div class="sum-l">karb</div></div>' +
    '<div class="sum-box"><div class="sum-v" style="color:var(--yag)">' + ft.yag + 'g</div><div class="sum-l">yağ</div></div>' +
    '<div class="sum-box"><div class="sum-v" style="color:var(--lif)">' + ft.lif + 'g</div><div class="sum-l">lif</div></div>' +
    '</div>' +
    '<div style="font-family:var(--mono);font-size:10px;color:var(--mut);text-align:center;margin-top:6px">Hedef: ' + target.kal + ' kcal · ' + target.pro + 'g P · ' + target.karb + 'g K · ' + target.yag + 'g Y · ' + target.lif + 'g Lif</div>' +
    '</div>';

  html += '<div class="sumcard"><div class="sumcard-title">Öğünler</div>';
  for (var i = 0; i < 3; i++) {
    var mt = mealTotals(entries[i] || []);
    html += '<div class="sum-meal"><div class="sum-meal-name">' + MEAL_ICONS[i] + ' ' + MEAL_NAMES[i] + '</div>' +
      '<div class="sum-meal-kcal">' + (mt.kal>0?mt.kal+' kcal':'—') + '</div></div>';
  }
  if (burn > 0) {
    html += '<div class="sum-meal"><div class="sum-meal-name">🏃 Aktivite</div>' +
      '<div class="sum-meal-kcal" style="color:var(--pro)">-' + burn + ' kcal</div></div>';
  }
  html += '</div>';

  html += '<button class="big-share-btn" onclick="shareDay()">📤 Günü Kopyala / Paylaş</button>';
  html += '</div>';
  return html;
}

function renderSheet() {
  if (!ui.sheet) return "";
  var foods = allFoods();
  var rawFood = foods[ui.sheet.foodIndex];
  if (!rawFood) return "";
  var variant = ui.sheet.variant;
  var food = resolveFood(rawFood, variant);
  var amt = ui.sheet.amt;
  var preview = calcFood(food, amt);

  var html = '<div class="sheet-overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="sh-handle"></div>' +
    '<div class="sh-food"><div class="sh-emoji">' + rawFood.emoji + '</div>' +
    '<div><div class="sh-name">' + esc(rawFood.name) + '</div><div class="sh-note">' + esc(food.note||"") + '</div></div></div>';

  if (rawFood.variants) {
    html += '<div class="variant-row">' +
      '<button class="var-btn' + (variant==="pismis"?' on':'') + '" onclick="switchVariant(\'pismis\')">🍳 Pişmiş</button>' +
      '<button class="var-btn' + (variant==="cig"?' on':'') + '" onclick="switchVariant(\'cig\')">🌿 Çiğ</button>' +
      '</div>';
  }

  html += '<div class="amt-row">' +
    '<button class="amt-btn" onclick="changeSheetAmt(-' + food.step + ')">−</button>' +
    '<input class="amt-val" type="number" step="any" value="' + fmtAmt(amt) + '" onchange="setSheetAmt(this.value)">' +
    '<button class="amt-btn" onclick="changeSheetAmt(' + food.step + ')">+</button>' +
    '<div class="amt-unit">' + esc(food.unit) + '</div></div>';

  html += '<div class="prev-row">' +
    '<div class="prev-box"><div class="prev-v">' + preview.kal + '</div><div class="prev-l">kcal</div></div>' +
    '<div class="prev-box"><div class="prev-v" style="color:var(--pro)">' + preview.pro + 'g</div><div class="prev-l">pro</div></div>' +
    '<div class="prev-box"><div class="prev-v" style="color:var(--karb)">' + preview.karb + 'g</div><div class="prev-l">karb</div></div>' +
    '<div class="prev-box"><div class="prev-v" style="color:var(--yag)">' + preview.yag + 'g</div><div class="prev-l">yağ</div></div>' +
    '<div class="prev-box"><div class="prev-v" style="color:var(--lif)">' + preview.lif + 'g</div><div class="prev-l">lif</div></div>' +
    '</div>';

  html += '<button class="sh-add" onclick="addEntry()">EKLE +</button></div></div>';
  return html;
}

function renderTargetSheet() {
  if (!ui.targetSheetOpen) return "";
  var t = getTarget();
  var fields = [
    { key:"kal", label:"Kalori (kcal)", color:"var(--acc)" },
    { key:"pro", label:"Protein (g)", color:"var(--pro)" },
    { key:"karb", label:"Karb (g)", color:"var(--karb)" },
    { key:"yag", label:"Yağ (g)", color:"var(--yag)" },
    { key:"lif", label:"Lif (g)", color:"var(--lif)" }
  ];
  var html = '<div class="sheet-overlay" onclick="if(event.target===this)closeTargetSheet()"><div class="sheet"><div class="sh-handle"></div>' +
    '<div style="font-family:\'Bebas Neue\';font-size:20px;letter-spacing:2px;color:var(--acc);margin-bottom:4px">Hedef Değerler</div>' +
    '<div style="font-family:var(--mono);font-size:10px;color:var(--mut);margin-bottom:18px">Değerleri güncelle, kaydet</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">';
  fields.forEach(function(f) {
    html += '<div style="display:flex;flex-direction:column;gap:5px">' +
      '<div style="font-family:var(--mono);font-size:9px;color:' + f.color + ';text-transform:uppercase;letter-spacing:1px">' + f.label + '</div>' +
      '<input class="amt-val" id="target-' + f.key + '" type="number" value="' + t[f.key] + '" style="font-size:22px;color:' + f.color + '">' +
      '</div>';
  });
  html += '</div><button class="sh-add" onclick="saveTargetValues()">KAYDET</button>' +
    '<button class="cf-cancel" onclick="closeTargetSheet()">İptal</button></div></div>';
  return html;
}

/* ============================= EVENT HANDLERS ============================= */

function setTab(i) { ui.tab = i; ui.sheet = null; render(); }
function setCat(c) { ui.cat = c; render(); }

function openSheet(foodIndex) {
  var foods = allFoods();
  var food = foods[foodIndex];
  if (!food) return;
  var variant = food.variants ? "pismis" : null;
  var resolved = resolveFood(food, variant);
  var startAmt = resolved.startAmt || (resolved.unit === "g" ? resolved.step * 4 : resolved.base);
  ui.sheet = { foodIndex: foodIndex, variant: variant, amt: startAmt };
  render();
}
function closeSheet() { ui.sheet = null; render(); }

function switchVariant(v) {
  if (!ui.sheet) return;
  ui.sheet.variant = v;
  var foods = allFoods();
  var food = resolveFood(foods[ui.sheet.foodIndex], v);
  ui.sheet.amt = food.unit === "g" ? food.step * 4 : food.base;
  render();
}

function changeSheetAmt(delta) {
  if (!ui.sheet) return;
  var foods = allFoods();
  var food = resolveFood(foods[ui.sheet.foodIndex], ui.sheet.variant);
  var next = ui.sheet.amt + delta;
  ui.sheet.amt = Math.round(Math.max(food.step, next) * 100) / 100;
  render();
}
function setSheetAmt(val) {
  if (!ui.sheet) return;
  var n = Number(val);
  if (!isNaN(n) && n > 0) ui.sheet.amt = n;
  render();
}

function addEntry() {
  if (!ui.sheet) return;
  var foods = allFoods();
  var rawFood = foods[ui.sheet.foodIndex];
  var resolved = resolveFood(rawFood, ui.sheet.variant);
  var entries = getEntries();
  if (!entries[ui.tab]) entries[ui.tab] = [];
  entries[ui.tab].push({ food: resolved, amt: ui.sheet.amt, variant: ui.sheet.variant, id: Date.now() });
  setEntries(entries);
  ui.sheet = null;
  render();
}

function removeEntry(idx) {
  var entries = getEntries();
  if (entries[ui.tab]) {
    entries[ui.tab].splice(idx, 1);
    setEntries(entries);
  }
  render();
}

function changeAct(i, delta) {
  var acts = getActs();
  acts[i] = Math.max(0, (acts[i] || 0) + delta);
  setActs(acts);
  render();
}
function setAct(i, val) {
  var acts = getActs();
  var n = Number(val);
  acts[i] = isNaN(n) ? 0 : Math.max(0, n);
  setActs(acts);
  render();
}

function openCustomForm() { ui.customFormOpen = true; render(); }
function closeCustomForm() { ui.customFormOpen = false; render(); }

function saveCustomFood() {
  var name = document.getElementById("cf-name").value.trim();
  var kal = document.getElementById("cf-kal").value;
  if (!name || !kal) { showToast("⚠️ İsim ve kalori gerekli"); return; }
  var unit = document.getElementById("cf-unit").value;
  var food = {
    name: name,
    emoji: document.getElementById("cf-emoji").value || "🍽️",
    unit: unit,
    step: unit === "g" ? 25 : 1,
    base: unit === "g" ? 100 : 1,
    kal: Number(kal),
    pro: Number(document.getElementById("cf-pro").value) || 0,
    karb: Number(document.getElementById("cf-karb").value) || 0,
    yag: Number(document.getElementById("cf-yag").value) || 0,
    lif: Number(document.getElementById("cf-lif").value) || 0,
    cat: "özel",
    note: "Özel ürün"
  };
  var customs = getCustomFoods();
  customs.push(food);
  setCustomFoods(customs);
  ui.customFormOpen = false;
  showToast("✅ " + name + " eklendi");
}

function openTargetSheet() { ui.targetSheetOpen = true; render(); }
function closeTargetSheet() { ui.targetSheetOpen = false; render(); }

function saveTargetValues() {
  var t = getTarget();
  ["kal","pro","karb","yag","lif"].forEach(function(k) {
    var el = document.getElementById("target-" + k);
    var val = Number(el.value);
    if (!isNaN(val) && val > 0) t[k] = val;
  });
  setTargetData(t);
  ui.targetSheetOpen = false;
  showToast("🎯 Hedefler güncellendi");
}

function showToast(msg) {
  ui.toast = msg;
  render();
  setTimeout(function() { ui.toast = null; render(); }, 2200);
}

function shareDay() {
  var entries = getEntries();
  var ft = allFoodTotals();
  var burn = totalBurn();
  var net = ft.kal - burn;
  var target = getTarget();
  var today = new Date().toLocaleDateString("tr-TR", { day:"numeric", month:"long" });
  var text = "📊 Günlük Beslenme — " + today + "\n────────────────────────────\n";
  for (var i = 0; i < 3; i++) {
    var items = entries[i] || [];
    if (!items.length) continue;
    var mt = mealTotals(items);
    text += "\n" + MEAL_NAMES[i] + " (" + mt.kal + " kcal)\n";
    items.forEach(function(e) {
      var n = calcFood(e.food, e.amt);
      var vl = e.variant ? (e.variant === "cig" ? " (çiğ)" : " (pişmiş)") : "";
      text += "  " + e.food.emoji + " " + e.food.name + vl + " — " + fmtAmt(e.amt) + " " + e.food.unit + " · " + n.kal + " kcal\n";
    });
  }
  if (burn > 0) {
    text += "\n🏃 Aktivite (-" + burn + " kcal)\n";
    var acts = getActs();
    ACTIVITIES.forEach(function(a, i) {
      if (acts[i] > 0) text += "  " + a.emoji + " " + a.name + " — " + acts[i] + " dk\n";
    });
  }
  text += "\n────────────────────────────\nNet: " + net + " kcal | Hedef: " + target.kal + " kcal\nProtein: " + ft.pro + "g / " + target.pro + "g\nKarb: " + ft.karb + "g / " + target.karb + "g\nYağ: " + ft.yag + "g / " + target.yag + "g\nLif: " + ft.lif + "g / " + target.lif + "g";

  function legacyCopy(t) {
    try {
      var el = document.createElement("textarea");
      el.value = t;
      el.style.position = "fixed";
      el.style.opacity = "0";
      document.body.appendChild(el);
      el.focus(); el.select();
      document.execCommand("copy");
      document.body.removeChild(el);
      showToast("📋 Panoya kopyalandı!");
    } catch(e) { showToast("⚠️ Kopyalanamadı"); }
  }

  if (navigator.share) {
    navigator.share({ text: text }).catch(function() { legacyCopy(text); });
  } else if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() { showToast("📋 Panoya kopyalandı!"); }).catch(function() { legacyCopy(text); });
  } else {
    legacyCopy(text);
  }
}

/* ============================= BAŞLAT ============================= */

window.addEventListener("error", function(e) {
  var app = document.getElementById("app");
  if (app) {
    app.innerHTML = '<div class="errbox">⚠️ Beklenmeyen hata:\n' + (e.message || e) + '\n\nSatır: ' + (e.lineno || "") + '</div>';
  }
});

render();
</script>
